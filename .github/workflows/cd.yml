name: CD

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write # packslip signs the manifest with the workflow identity
      attestations: write # packslip publishes build provenance for the artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Check for RELEASE.txt
        id: guard
        run: |
          if [ ! -f RELEASE.txt ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: steps.guard.outputs.skip != 'true'
        with:
          cache: true

      - name: Read bump level
        if: steps.guard.outputs.skip != 'true'
        id: level
        run: echo "value=$(head --lines 1 RELEASE.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Bump version
        if: steps.guard.outputs.skip != 'true'
        env:
          BUMP_LEVEL: ${{ steps.level.outputs.value }}
        run: bump-my-version bump "${BUMP_LEVEL,,}"

      - name: Read new version
        if: steps.guard.outputs.skip != 'true'
        id: version
        run: echo "value=$(bump-my-version show current_version)" >> "$GITHUB_OUTPUT"

      - name: Save release notes
        if: steps.guard.outputs.skip != 'true'
        run: tail --lines +2 RELEASE.txt > /tmp/release-notes.md

      - name: Update changelog
        if: steps.guard.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: zig build update-changelog -- "$VERSION"

      - name: Remove RELEASE.txt
        if: steps.guard.outputs.skip != 'true'
        run: rm RELEASE.txt

      - name: Run formatters
        if: steps.guard.outputs.skip != 'true'
        run: hk run fix

      - name: Commit release
        id: commit
        if: steps.guard.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.zig.zon .bumpversion.toml CHANGELOG.md RELEASE.txt README.md
          git commit --message="Release v$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Tag release
        if: steps.guard.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: git tag --annotate --message="Version $VERSION" "v$VERSION"

      - name: Build binaries
        if: steps.guard.outputs.skip != 'true'
        run: |
          zig build -Dtarget=x86_64-linux-gnu -Doptimize=ReleaseSafe --prefix zig-out/x86_64-linux-gnu
          zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSafe --prefix zig-out/x86_64-linux-musl

      - name: Prepare release assets
        if: steps.guard.outputs.skip != 'true'
        run: |
          cp zig-out/x86_64-linux-gnu/bin/zeile zeile-x86_64-linux-gnu
          cp zig-out/x86_64-linux-musl/bin/zeile zeile-x86_64-linux-musl

      - name: Push
        if: steps.guard.outputs.skip != 'true'
        run: git push origin main --follow-tags

      - name: Create GitHub release
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file /tmp/release-notes.md \
            zeile-x86_64-linux-gnu \
            zeile-x86_64-linux-musl

      # The push above is not a tag event, so tag, version and commit must be
      # passed explicitly. The artifacts input takes plain file globs, platform
      # and format are inferred from the file names.
      - name: Publish packslip
        id: packslip
        if: steps.guard.outputs.skip != 'true'
        uses: jdx/packslip@4920350c39c234c7a969f9775040bd02829f1923 # v1.3.0
        with:
          artifacts: zeile-x86_64-linux-gnu zeile-x86_64-linux-musl
          bin: zeile
          upload: false # dry run: keep the bundle local until verified
          tag: v${{ steps.version.outputs.value }}
          version: ${{ steps.version.outputs.value }}
          commit: ${{ steps.commit.outputs.sha }}

      # Only needed while upload is disabled, to inspect what would be published
      - name: Show packslip
        if: steps.guard.outputs.skip != 'true'
        env:
          BUNDLE: ${{ steps.packslip.outputs.bundle }}
        run: packslip show "$BUNDLE"
